version: '3.8'

services:
  metadata-service:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - METADATA_URL=http://localhost:3000
      - INDEXER_SERVICE_URL=http://host.docker.internal:3001
    volumes:
      - ./src:/app/src
      - ./package.json:/app/package.json
    depends_on:
      - indexer-service
    networks:
      - metadata-network
    restart: unless-stopped

  indexer-service:
    image: namespace-indexer:latest
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
    networks:
      - metadata-network
    restart: unless-stopped
    profiles:
      - with-indexer

networks:
  metadata-network:
    driver: bridge

volumes:
  node_modules:
